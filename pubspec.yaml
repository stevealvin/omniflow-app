name: omniflow
description: "星环流动 OmniFlow 移动端伴侣应用"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  material_ui: ^1.2.0
  http: ^1.6.0
  go_router: ^18.0.1
  intl: ^0.20.3
  custom_refresh_indicator: ^4.0.2
  lucide_icons_flutter: ^3.1.19
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.3
  flutter_js: ^0.8.7
  crypto: ^3.0.7
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:

  uses-material-design: true

  assets:
    - assets/icon/icon.png
    - assets/logo.png
    - assets/js/cliguard.js
    - assets/js/node_shim.js
    - assets/js/pako.min.js

